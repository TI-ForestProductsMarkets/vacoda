[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vacoda"
version = "1.4.6"
description = "VAlidation of COmtrade DAta - A Python package for validating and preprocessing UN-Comtrade data for trade analysis."
authors = [
    {name = "Pooja Saxena"},
    ]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Core
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pycountry-convert>=0.7.2",

    # Performance
    "polars>=0.20",
    "tqdm>=4.66",
    "joblib>=1.3",

    # Visualization
    "plotly>=5.20",
    "altair>=5.2",

    # Stats / ML
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "xgboost>=2.0",

    # Validation
    "pandera>=0.18",

    # App
    "streamlit>=1.32"
]


[project.optional-dependencies]
dev = [
    "pytest>=7.4"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# =======================
# PyTest
# =======================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]