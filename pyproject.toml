[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vacoda"
version = "1.8.0"
description = "VAlidation of COmtrade DAta - A Python package for validating and preprocessing UN-Comtrade data for trade analysis."
authors = [
    {name = "Pooja Saxena"},
    ]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Core data handling
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    
    # API / config
    "requests>=2.31",
    "python-dotenv>=1.0",

    # Runtime utilities
    "tqdm>=4.66",
]

[project.scripts]
vacoda-pipeline = "vacoda.pipeline.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

viz = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.20",
    "altair>=5.2",
]

geo = [
    "pycountry-convert>=0.7.2",
]

performance = [
    "polars>=0.20",
    "joblib>=1.3",
]

stats = [
    "scipy>=1.11",
    "statsmodels>=0.14",
]

ml = [
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]

validation = [
    "pandera>=0.18",
]

app = [
    "streamlit>=1.32",
]

all = [
    "vacoda[viz,geo,performance,stats,ml,validation,app]",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

