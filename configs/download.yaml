download:
  endpoint: "https://api.uncomtrade.org/data/v1/get/C/A/HS"
  endpoint_fallbacks:
    - "https://comtradeapi.un.org/data/v1/get/C/A/HS"

  # Any key here is applied to every job unless explicitly overridden.
  default_params:
    format: "csv"
    # maxRecords is page size per API call, not total rows.
    # Pagination will keep requesting pages until no more rows are returned.
    maxRecords: 250000
    includeDesc: true

  # One job = one API call + one output file in the configured output directory.
  jobs:
    - name: "hs_441012_world_imports"
      params:
        # Omit reporterCode to request all reporters on this endpoint.
        reporterCode:
        # Partner 0 = World aggregate.
        partnerCode: "0"
        cmdCode: "441012"
        # M = imports
        flowCode: "M"
        period: "all"
      output_file: "Comtrade_441012_all_rows.csv"


  output:
    directory: "data/api"
    manifest_file: "download_manifest.json"

  retry:
    max_attempts: 3
    backoff_seconds: 2.0

  runtime:
    timeout_seconds: 120
    overwrite_existing: false

  auth:
    enabled: true
    method: "header"
    header_name: "Ocp-Apim-Subscription-Key"
    env_var_name: "COMTRADE_API_KEY"
    query_param_name: "token"
    env_file: ".env"

  pagination:
    enabled: true
    limit_param: "maxRecords"
    offset_param: "offset"
    start_offset: 0

  # Settings used by scripts/run_comtrade_api.py --mode single
  single:
    timeout_seconds: 120
    all_years_start: 1962
    all_years_end: 2025
    output_file: "comtrade_single.json"
