harvard_weights:
  enabled: false
  status: optional
  description: "Optional Harvard-style optimized conversion weight generation."

  input:
    stage: external
    subdir: harvard_comtrade/as_reported/raw_parquet_partitioned
    pattern: "hs_partition=*/year_partition=*/*.parquet"
    format: parquet

  static:
    stage: references
    subdir: harvard_comtrade
    concordance_file: hs_concordance.csv

  output:
    stage: references
    subdir: hs_sync/weights/harvard
    file: "harvard_hs_conversion_weights.parquet"

  report:
    output_kind: reports
    filename: "audit_hs_sync_harvard_weights.csv"
    timestamp: true
    write_latest: true