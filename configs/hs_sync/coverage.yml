# configs/hs_sync/coverage.yaml

input:
  stage: external
  subdir: harvard_comtrade/as_reported/raw_parquet_partitioned
  pattern: "hs_partition=*/year_partition=*/*.parquet"
  format: parquet

mappings:
  stage: references
  subdir: hs_sync/mappings
  files:
    h6_to_h5: h6_to_h5.csv
    h5_to_h5: h5_to_h5.csv
    h4_to_h5: h4_to_h5.csv
    h3_to_h5: h3_to_h5.csv
    h2_to_h5: h2_to_h5.csv

categories:
  easy_without_weights:
    - already_target
    - "1:1"
    - "n:1"

  needs_weights:
    - "1:n"
    - "n:n"

  missing:
    - missing_mapping
    - unsupported_source_hs

products:
  source_code_coverage:
    enabled: true
    filename: "{target_hs_lower}_source_code_coverage"
    write: true

  mapping_coverage:
    enabled: true
    filename: "{target_hs_lower}_mapping_coverage"
    write: true

  mapping_summary:
    enabled: true
    depends_on: mapping_coverage
    filename: "{target_hs_lower}_mapping_summary"
    write: true

  mapping_interpretation_report:
    enabled: true
    depends_on: source_code_coverage
    filename: "{target_hs_lower}_mapping_interpretation_report"
    write: true

  mapping_interpretation_display_report:
    enabled: true
    depends_on: mapping_interpretation_report
    filename: "{target_hs_lower}_mapping_interpretation_display_report"
    output_kind: reports
    write: true

  missing_mappings:
    enabled: true
    depends_on: mapping_coverage
    filename: "{target_hs_lower}_missing_mappings"
    write: true
    options:
      top_n: 50

  needs_weights:
    enabled: true
    depends_on: mapping_coverage
    filename: "{target_hs_lower}_needs_weights"
    write: true

  easy_without_weights:
    enabled: true
    depends_on: mapping_coverage
    filename: "{target_hs_lower}_easy_without_weights"
    write: true

    
output:
  stage: interim
  subdir: "hs_sync/target_{target_hs_lower}_mapping_coverage"

write:
  csv: true
  parquet: true
  overwrite: true

report:
  output_kind: reports
  filename: "audit_hs_sync_target_{target_hs_lower}_mapping_coverage.csv"
  timestamp: true
  write_latest: true