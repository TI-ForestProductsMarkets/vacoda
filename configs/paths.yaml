# configs/paths.yaml

storage_root: "/storage/vacoda"

data:
  root: "{storage_root}/data"
  raw: "{data.root}/raw"
  external: "{data.root}/external"
  interim: "{data.root}/interim"
  processed: "{data.root}/processed"
  references: "{data.root}/references"

output:
  root: "{storage_root}/output"
  figures: "{output.root}/figures"
  logs: "{output.root}/logs"
  reports: "{output.root}/reports"
  manifests: "{output.root}/manifests"

slurm:
  root: "{storage_root}/slurm"
  reports: "{slurm.root}/output/reports"

metadata:
  root: "{data.references}/metadata"
  hs_version: "{metadata.root}/hs_version.parquet"
  reporter: "{metadata.root}/reporter.parquet"
  commodity: "{metadata.root}/commodity.parquet"
  flow: "{metadata.root}/flow.parquet"
  unit: "{metadata.root}/unit.parquet"
  estimation: "{metadata.root}/estimation.parquet"