# Configuration file for data paths in the vacoda project.

storage_root: /storage/vacoda

data:
  root: /storage/vacoda/data
  raw: /storage/vacoda/data/raw
  external: /storage/vacoda/data/external
  interim: /storage/vacoda/data/interim
  processed: /storage/vacoda/data/processed
  references: /storage/vacoda/data/references

output:
  root: /storage/vacoda/output
  figures: /storage/vacoda/output/figures
  logs: /storage/vacoda/output/logs
  reports: /storage/vacoda/output/reports
  manifests: /storage/vacoda/output/manifests

slurm:
  reports: /storage/slurm/output/reports

metadata:
  root: /storage/vacoda/data/references/metadata
  hs_version: /storage/vacoda/data/references/metadata/hs_version.parquet
  reporter: /storage/vacoda/data/references/metadata/reporter.parquet
  commodity: /storage/vacoda/data/references/metadata/commodity.parquet
  flow: /storage/vacoda/data/references/metadata/flow.parquet
  unit: /storage/vacoda/data/references/metadata/unit.parquet
  estimation: /storage/vacoda/data/references/metadata/estimation.parquet

logging:
  dir: /storage/vacoda/output/logs