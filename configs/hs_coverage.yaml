# Configuration for HS-Coverage diagnostics.

## General configuration
logging:
  level: DEBUG
  file: LOG_HS_COVERAGE.log
  timestamp: true


## Coverage analysis configuration
coverage:
  input:
    stage: raw
    subdir: api/single
    pattern: "*.csv"

  output:
    stage: interim
    subdir: hs_coverage

  engine:
    name: duckdb      # options: duckdb, polars, pandas
    threads: 16

  progress:
    enabled: true

  write:
    csv: true
    parquet: true
    overwrite: true
    timestamp: false
    allow_empty: true


  ## Products to generate. Each product will be generated only if all its dependencies are generated successfully.
  products:

    year_hs_counts:
      enabled: true
      filename: year_hs_counts_long

      columns:
        year: RefYear
        hs: ClassificationCode

    hs_system_overall_summary:
      enabled: true
      depends_on: year_hs_counts
      filename: hs_system_overall_summary

    year_hs_count_pivot:
      enabled: true
      depends_on: year_hs_counts
      filename: year_hs_counts_pivot

    year_hs_percentage_pivot:
      enabled: true
      depends_on: year_hs_count_pivot
      filename: year_hs_percentage_pivot

    year_hs_mix_summary:
      enabled: true
      depends_on: year_hs_count_pivot
      filename: year_hs_mix_summary

      thresholds:
        clean: 98.0
        mostly_clean: 95.0

    reporter_year_hs_coverage:
      enabled: true
      filename: reporter_year_hs_coverage

      columns:
        reporter_code: ReporterCode
        reporter_iso: ReporterISO
        reporter_desc: ReporterDesc
        year: RefYear
        hs: ClassificationCode
        hs_search: ClassificationSearchCode
        original: IsOriginalClassification
        cmd: CmdCode
        flow: FlowCode
        value: PrimaryValue
        netweight: NetWgt
    
    reporter_hs_timeline:
      enabled: true
      depends_on: reporter_year_hs_coverage
      filename: reporter_hs_timeline

    reporter_year_dominant_hs:
      enabled: true
      depends_on: reporter_year_hs_coverage
      filename: reporter_year_dominant_hs

    hs_transition_events:
      enabled: true
      depends_on: reporter_year_hs_coverage
      filename: hs_transition_events

    mixed_classification_reporter_years:
      enabled: true
      depends_on: reporter_year_hs_coverage
      filename: mixed_classification_reporter_years

    year_hs_cmd4_coverage:
      enabled: true
      filename: year_hs_cmd4_coverage

      columns:
        year: RefYear
        hs: ClassificationCode
        cmd: CmdCode

    top_cmd4_by_year_hs:
      enabled: true
      depends_on: year_hs_cmd4_coverage
      filename: top_cmd4_by_year_hs
      top_n: 10

    cmd4_hs_timeline:
      enabled: true
      depends_on: year_hs_cmd4_coverage
      filename: cmd4_hs_timeline

    cmd4_hs_diversity_summary:
      enabled: true
      depends_on: year_hs_cmd4_coverage
      filename: cmd4_hs_diversity_summary

    cmd4_hs_transition_events:
      enabled: true
      depends_on: year_hs_cmd4_coverage
      filename: cmd4_hs_transition_events

  report:
    enabled: true
    output_kind: reports
    filename: audit_hs_system_coverage_report.txt
    timestamp: true
    write_latest: true
   