# configs/hs_sync.yaml

scope:
  target_hs: H5
  min_year: 2017
  max_year: 2025

engine:
  name: duckdb
  threads: 16

progress:
  enabled: true

logging:
  level: INFO
  file: hs_sync.log
  timestamp: true

columns:
  year: RefYear
  hs: ClassificationCode
  cmd: CmdCode
  value: PrimaryValue

workflows:
  harvard_staging:
    enabled: true
    config: hs_sync/harvard_staging.yaml

  coverage:
    enabled: true
    config: hs_sync/coverage.yaml

  harvard_weights:
    enabled: false
    config: hs_sync/harvard_weights.yaml

  un_comtrade_mapping:
    enabled: false
    config: hs_sync/un_comtrade_mapping.yaml

  weight_strategy:
    enabled: false
    config: hs_sync/weight_strategies.yaml