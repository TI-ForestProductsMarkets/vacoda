## HS Synchronization Configuration

# ============================================================
# Global HS-sync scope
# ============================================================

global:
  scope:
    # Final target HS system for normalized HS-sync outputs.
    target_hs: "H5"
    min_year: 2002
    max_year: 2025

  engine:
    name: "duckdb"
    threads: 48

  progress:
    enabled: true

  columns:
    year: "RefYear"
    hs: "ClassificationCode"
    cmd: "CmdCode"
    value: "PrimaryValue"

  logging:
    level: "DEBUG"
    file: "LOG_HS_SYNC_COVERAGE.log"
    timestamp: true


# ============================================================ 
# Harvard reference-build staging 
# ============================================================ 
# This block prepares Comtrade bulk data in the layout expected by the 
# external Harvard/Growth Lab generator. 
# 
# It is not part of the normal HS-sync coverage workflow. 
# It is run rarely, only when Harvard generator inputs need to be rebuilt.
harvard_staging:
  enabled: true

  input:
    stage: "raw"
    subdir: "api/bulk"
    pattern: "Comtrade_bulk_HS_*_all_reporters_*.gz"

  output:
    stage: "external"
    subdir: "harvard_comtrade_bulk"

  filters:
    valid_cmd_regex: "^[0-9]{6}$"
    hs_years:
      H0: [1995]
      H1: [1996, 2001]
      H2: [2002, 2006]
      H3: [2007, 2011]
      H4: [2012, 2016]
      H5: [2017, 2021]
      H6: [2022]

  columns:
    year: "refYear"
    hs: "classificationCode"
    cmd: "cmdCode"
    value: "primaryValue"
    reporter_code: "reporterCode"
    partner_code: "partnerCode"
    flow: "flowCode"
    quantity: "netWgt"

  overwrite: false

  country_reference:
    source: "single_api"
    stage: "raw"
    subdir: "api/single"
    pattern: "*.csv"
    columns:
      reporter_code: "ReporterCode"
      reporter_iso: "ReporterISO"
      partner_code: "PartnerCode"
      partner_iso: "PartnerISO"

  diagnostics:
    value_abs_tolerance: 1.0
    value_rel_tolerance: 1.0e-10

  artifact:
    kind: "manifest"
    subdir: "hs_sync/harvard_staging"
    inventory_filename: "audit_hs_sync_harvard_staging_inventory.csv"
    preservation_filename: "audit_hs_sync_harvard_staging_preservation.csv"
    timestamp: true
    write_latest: true

# ============================================================ 
# Frozen reference artifacts 
# ============================================================ 
# These are stable VACODA-owned reference artifacts. 
# 
# Important distinction: 
# - /storage/vacoda/data/references may contain the external Harvard generator package. 
# - vacoda/references contains copied/frozen artifacts used by VACODA itself.
references:
  harvard_generator:
    hs_adjacent_transition_1995_2022:
      source: "repo"
      path: "references/harvard_generator/hs_adjacent_transition_1995_2022"
      matrices_subdir: "matrices"
      correlation_group_subdir: "correlation_group"
      provenance_subdir: "provenance"
  
  comtrade:
    hs_correlation_groups:
      source: "repo"
      path: "references/comtrade/hs_correlation_groups"


# ============================================================ 
# Coverage mapping diagnostics 
# ============================================================ 
# This is the main HS-sync coverage study. 
#
# It consumes observed trade data and mapping/correlation files, then asks: 
# how much can be expressed in the target HS system without weights?

coverage:
  # Diagnostic target HS system for coverage/audit studies.
  # May differ from scope.target_hs during experiments.
  enabled: true
  target_hs: "H5"
  min_year: 2017
  max_year: 2025

  input:
    stage: "raw"
    subdir: "api/single"
    pattern: "*.csv"
    format: "csv"

  mappings:
    stage: "references"
    subdir: "harvard_generator/hs_adjacent_transition_1995_2022/correlation_group"

    files:
      H4_to_H5: "from_HS2012_to_HS2017.csv"
      H6_to_H5: "from_HS2022_to_HS2017.csv"

    columns:
      source_cmd: "code.source"
      target_cmd: "code.target"
      relationship: "Relationship"
      adjustment: "adjustment"
      group_id: "group.id"

  categories:
    easy_without_weights:
      - "already_target"
      - "1:1"
      - "n:1"

    needs_weights:
      - "1:n"
      - "n:n"

    missing:
      - "missing_mapping"

  output:
    stage: "interim"
    subdir: "hs_sync/target_{target_hs_lower}_mapping_coverage"

  write:
    csv: true
    parquet: false
    overwrite: true
    timestamp: false

  artifact:
    kind: "reports"
    subdir: "hs_sync/coverage"
    filename: "{target_hs_lower}_mapping_coverage_report"
    timestamp: true
    write_latest: true
    options:
      unsupported_top_n: 30
      needs_weights_top_n: 10

  products: 
    mapping_coverage: 
      enabled: true 
      kind: "base" 
      filename: "{target_hs_lower}_mapping_coverage" 
      write: true 
    
    source_code_coverage: 
      enabled: true 
      kind: "derived" 
      depends_on: "mapping_coverage" 
      filename: "{target_hs_lower}_source_code_coverage" 
      write: true 

    mapping_summary: 
      enabled: true 
      kind: "derived" 
      depends_on: "mapping_coverage" 
      filename: "{target_hs_lower}_mapping_summary" 
      write: true 

    missing_mappings: 
      enabled: true 
      kind: "derived" 
      depends_on: "mapping_coverage" 
      filename: "{target_hs_lower}_missing_mappings" 
      write: true 
      options: 
        top_n: 50 

    needs_weights: 
      enabled: true 
      kind: "derived" 
      depends_on: "mapping_coverage" 
      filename: "{target_hs_lower}_needs_weights" 
      write: true 

    easy_without_weights: 
      enabled: true 
      kind: "derived" 
      depends_on: "mapping_coverage" 
      filename: "{target_hs_lower}_easy_without_weights" 
      write: true



# ============================================================
# Harvard weights / optional weight generation
# ============================================================
harvard_weights:
  enabled: false
  status: planned


# ============================================================
# Future UN Comtrade mappings
# ============================================================
un_comtrade_mapping:
  enabled: false
  status: planned


# ============================================================
# Future weight strategies
# ============================================================
weight_strategy:
  enabled: false
  status: planned