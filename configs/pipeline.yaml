# configs/pipeline.yaml
# VACODA master pipeline configuration.
#
# The pipeline orchestrates module-level workflows.
# Each module keeps its own detailed config and audit logic.

pipeline:
  name: "vacoda_main_pipeline"
  version: 1
  enabled: true

  # Run order matters.
  enabled_steps:
    - "ingestion"
    - "hs_sync"
    - "quantity"
    - "cif_fob"
    - "trade_sync"
    - "value"
    - "validation"
    - "release"

  # Stop immediately if a step fails or reports ready_for_next_step=false.
  fail_fast: true

  # If true, completed existing outputs may be reused by module logic
  allow_skip_existing: true

  # If true, all steps will run even if they are already completed and reusable. Overrides allow_skip_existing.
  force_run_all: false  
  
  # Safety gate before running expensive pipeline steps.
  require_confirmation: true

scope:
  target_hs: "H5"
  min_year: 2017
  max_year: 2025

engine:
  name: "duckdb"
  threads: 50

steps:
  ingestion:
    enabled: true
    config: "configs/steps/ingestion.yaml"
    expected_status:
      - "completed"
      - "skipped_existing"
    required_ready_flag: "ready_for_hs_sync"

  hs_sync:
    enabled: true
    config: "configs/steps/hs_sync.yaml"
    expected_status:
      - "completed"
    required_ready_flag: "ready_for_quantity"

  quantity:
    enabled: true
    config: "configs/steps/quantity.yaml"
    expected_status:
      - "completed"
    required_ready_flag: "ready_for_cif_fob"

  cif_fob:
    enabled: true
    config: "configs/steps/cif_fob.yaml"
    expected_status:
      - "completed"
    required_ready_flag: "ready_for_trade_sync"

  trade_sync:
    enabled: true
    config: "configs/steps/trade_sync.yaml"
    expected_status:
      - "completed"
    required_ready_flag: "ready_for_value_sync"

  value:
    enabled: true
    config: "configs/steps/value.yaml"
    expected_status:
      - "completed"
    required_ready_flag: "ready_for_validation"

  validation:
    enabled: true
    config: "configs/steps/validation.yaml"
    expected_status:
      - "completed"
    required_ready_flag: "ready_for_release"

  release:
    enabled: true
    config: "configs/steps/release.yaml"
    expected_status:
      - "completed"
    required_ready_flag: "release_completed"
    
checkpoint:
  enabled: true
  kind: "manifests"
  subdir: "pipeline/checkpoints"
  reuse_successful_steps: true
  fingerprint_mode: "strong_metadata"  # fast | strong_metadata | content_hash
  
manifest:
  stage: "output"
  kind: "manifests"
  subdir: "pipeline"
  filename: "vacoda_pipeline_manifest.csv"
  timestamp: true

logging:
  level: "INFO"
  subdir: "pipeline"
  file: "LOG_VACODA_PIPELINE.log"
  timestamp: true

