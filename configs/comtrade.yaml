# Comtrade download config
# Docs: https://comtradedeveloper.un.org/api-details
# Subscription plans: https://uncomtrade.org/docs/subscriptions/

# IMPORTANT:
# Store your API key in .env like this:
# COMTRADE_API_KEY=your_key_here

# Token tips:
# - cmdCode can use token names from src/vacoda/reference/hs_sets.py
# - flowCode can use token names from src/vacoda/reference/flow_sets.py


# -------------------------------------------
# BULK API DOWNLOADS
# -------------------------------------------
# Bulk downloads broad Comtrade files.
# Commodity and flow filters should usually be applied locally after download.

bulk:
  enabled: false

  jobs:
    - name: "hs_all_reporters"
      params:
        typeCode: "C"
        freqCode: "A"
        clCode: "HS"
        reporterCode: "all"
        partnerCode: "all"

      # year-range
      years:
        enabled: true
        start: 2024
        end: 2025

      # Applied locally after bulk files are downloaded and parsed.
      local_filter:
        cmdCode: "WOOD_PANEL"
        flowCode: "FLOW_ALL"

      output_file: "Comtrade_bulk_HS_{period}_all_reporters.zip"

  output:
    directory: "/data/comtrade/data/raw/api/bulk"
    quarantine_directory: "/data/comtrade/data/raw/api/bulk/_quarantine_zero_byte"
    manifest_file: "download_manifest_bulk.json"


# -------------------------------------------
# NORMAL DATA API DOWNLOADS
# -------------------------------------------
# Normal API downloads precise query results.
# Recommended job unit:
# one commodity group × one year or generated year loop.

single:
  enabled: true

  jobs:
    - name: "wood_panel_direct"
      params:
        reporterCode:
        partnerCode:
        cmdCode: "WOOD_PANEL"
        flowCode: "FLOW_ALL"

      output_file: "comtrade_{cmdCode}_{period}.csv"
      use_reference_years: true
      fallback_years_start: 1989
      fallback_years_end: 2025

  output:
    directory: "/data/comtrade/data/raw/api/test/"
    quarantine_directory: "/data/comtrade/data/raw/api/test/_quarantine_zero_byte"
    manifest_file: "download_manifest_single.json"



# -------------------------------------------
# LOGGING
# -------------------------------------------

log_level: DEBUG # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_file: output/reports/LOG_API_PIPELINE.log



######################### ADVANCED SETTINGS BELOW ##########################################
######################### Only modify if you know what you're doing! #########################

# -------------------------------------------
# RETRY AND RUNTIME
# -------------------------------------------

retry:
  max_attempts: 3
  backoff_seconds: 2.0
  rate_limit:
    max_attempts: 0
    buffer_seconds: 0
    fallback_wait_seconds: 0

runtime:
  show_progress: true
  timeout_seconds: 300
  overwrite_existing: false
  # What to do when an existing output file fails validation.
  # Valid existing files are always skipped unless overwrite_existing=true.
  existing_file_policy: "redownload" # Options: "skip", "redownload", "fail", 'warn'
  max_workers: 8


# -------------------------------------------
# DEFAULT DATA API PARAMETERS
# -------------------------------------------

default_params:
  format: "csv"
  maxRecords: 250000
  includeDesc: true

# -------------------------------------------
# ENDPOINTS
# -------------------------------------------

endpoint:
  single: "https://comtradeapi.un.org/data/v1/get/C/A/HS"
  single_fallbacks:
    - "https://api.uncomtrade.org/data/v1/get/C/A/HS"
  bulk: "https://comtradeapi.un.org/bulk/v1/get/"


# -------------------------------------------
# AUTHENTICATION
# -------------------------------------------

auth:
  enabled: true
  method: "header"
  header_name: "Ocp-Apim-Subscription-Key"
  env_var_name: "COMTRADE_API_KEY"
  query_param_name: "token"
  env_file: ".env"


# -------------------------------------------
# PAGINATION
# -------------------------------------------

pagination:
  enabled: true
  limit_param: "maxRecords"
  offset_param: "offset"
  start_offset: 0



