# Comtrade download config
# Docs: https://comtradedeveloper.un.org/api-details
# Subscription plans: https://uncomtrade.org/docs/subscriptions/

# IMPORTANT:
# Store your API key in .env like this:
# COMTRADE_API_KEY=your_key_here

# Token tips:
# - cmdCode can use token names from src/vacoda/reference/hs_sets.py
# - flowCode can use token names from src/vacoda/reference/flow_sets.py


# -------------------------------------------
# BULK API DOWNLOADS
# -------------------------------------------
# Bulk downloads broad Comtrade files.
# Commodity and flow filters should usually be applied locally after download.

bulk:
  enabled: false

  jobs:
    - name: "hs_2023_all_reporters"
      params:
        typeCode: "C"
        freqCode: "A"
        clCode: "HS"
        period: "2023"
        reporterCode: "all"
        partnerCode: "all"

      # Applied locally after bulk files are downloaded and parsed.
      local_filter:
        cmdCode: "WOOD_PANEL"
        flowCode: "FLOW_ALL"

      output_file: "Comtrade_bulk_HS_{period}_all_reporters.zip"

  output:
    directory: "data/raw/api/bulk"
    manifest_file: "download_manifest_bulk.json"


# -------------------------------------------
# NORMAL DATA API DOWNLOADS
# -------------------------------------------
# Normal API downloads precise query results.
# Recommended job unit:
# one commodity group × one year or generated year loop.

single:
  enabled: true

  jobs:
    - name: "wood_panel_direct"
      params:
        reporterCode:
        partnerCode:
        cmdCode: "WOOD_PANEL"
        flowCode: "FLOW_ALL"

      output_file: "comtrade_{cmdCode}_{period}.csv"
      use_reference_years: true
      fallback_years_start: 1990
      fallback_years_end: 2025

  output:
    directory: "data/raw/api/single"
    manifest_file: "download_manifest_single.json"


# -------------------------------------------
# LOGGING
# -------------------------------------------

log_level: DEBUG # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
log_file: output/reports/LOG_API_PIPELINE.log


# -------------------------------------------
# DEFAULT DATA API PARAMETERS
# -------------------------------------------

default_params:
  format: "csv"
  maxRecords: 250000
  includeDesc: true


# -------------------------------------------
# RETRY AND RUNTIME
# -------------------------------------------

retry:
  max_attempts: 3
  backoff_seconds: 2.0

runtime:
  timeout_seconds: 120
  overwrite_existing: false
  max_workers: 4


# -------------------------------------------
# ENDPOINTS
# -------------------------------------------

endpoint:
  single: "https://comtradeapi.un.org/data/v1/get/C/A/HS"
  single_fallbacks:
    - "https://api.uncomtrade.org/data/v1/get/C/A/HS"
  bulk: "https://comtradeapi.un.org/bulk/v1/get/"


# -------------------------------------------
# AUTHENTICATION
# -------------------------------------------

auth:
  enabled: true
  method: "header"
  header_name: "Ocp-Apim-Subscription-Key"
  env_var_name: "COMTRADE_API_KEY"
  query_param_name: "token"
  env_file: ".env"


# -------------------------------------------
# PAGINATION
# -------------------------------------------

pagination:
  enabled: true
  limit_param: "maxRecords"
  offset_param: "offset"
  start_offset: 0



