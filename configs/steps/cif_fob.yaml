# configs/steps/cif_fob.yaml
# Configuration for the CIF/FOB correction step.

cif_fob:
  input:
    stage: "interim"
    subdir: "hs_sync/target_{target_hs_lower}/applied"
    filename: "comtrade_target_{target_hs_lower}_hs_synced.parquet"
    format: "parquet"

  output:
    stage: "interim"
    subdir: "cif_fob/target_{target_hs_lower}"
    format: "parquet"

  logging:
    level: "DEBUG"
    subdir: "logs/cif_fob"
    file: "LOG_CIF_FOB_TARGET_{target_hs_lower}.log"
    timestamp: true

  source_data:
    supported_flows:
      import: "M"
      export: "X"

    columns:
      year: "year"
      reporter: "reporter_iso"
      partner: "partner_iso"
      flow: "flow_code"
      commodity: "target_cmd"

      is_reported: "is_reported"
      is_aggregate: "is_aggregate"

      canonical_value: "primary_value_hs_synced"
      source_value: "primary_value"

      direct_cif_value: "cif_value_usd"
      direct_fob_value: "fob_value_usd"
      allocation_weight: "allocation_weight"

      quantity: "quantity"
      quantity_unit: "quantity_unit"
      quantity_estimated: "is_quantity_estimated"

      alt_quantity: "alt_quantity"
      alt_quantity_unit: "alt_quantity_unit"
      alt_quantity_estimated: "is_alt_quantity_estimated"

      net_weight: "net_weight_kg"
      net_weight_estimated: "is_net_weight_estimated"

      gross_weight: "gross_weight_kg"
      gross_weight_estimated: "is_gross_weight_estimated"

    allocate_supplementary_measures: true

  products:
    prepared_input:
      enable: true
      filename: "prepared/comtrade_target_{target_hs_lower}_cif_fob_prepared.parquet"

    mirror_pairs:
      enable: true
      filename: "target_{target_hs_lower}_cif_fob_mirror_pairs.parquet"

    training_sample:
      enable: true
      filename: "target_{target_hs_lower}_cif_fob_training_sample.parquet"
      
    training_features:
      enable: true
      filename: "target_{target_hs_lower}_cif_fob_training_features.parquet"

    estimated_rates:
      enable: true
      filename: "target_{target_hs_lower}_cif_fob_estimated_rates.parquet"
    
    temporal_validation_summary:
      enable: true
      filename: "target_{target_hs_lower}_cif_fob_temporal_validation_summary.csv"

    temporal_validation_folds:
      enable: true
      filename: "target_{target_hs_lower}_cif_fob_temporal_validation_folds.csv"

    upper_tail_audit_summary:
      enable: true
      filename: "target_{target_hs_lower}_cif_fob_upper_tail_audit_summary.csv"

    upper_tail_route_history:
      enable: true
      filename: "target_{target_hs_lower}_cif_fob_upper_tail_route_history.csv"

    upper_tail_observations:
      enable: true
      filename: "target_{target_hs_lower}_cif_fob_upper_tail_observations.parquet"

    corrected_trade:
      enable: false
      filename: "comtrade_target_{target_hs_lower}_cif_fob_corrected.parquet"

  artifacts:
    enable: true
    kind: "reports"
    subdir: "cif_fob/target_{target_hs_lower}"
    filename: "target_{target_hs_lower}_cif_fob_decision_report"
    timestamp: true
    write_latest: true
    

  features:
    # Country-level characteristics
    geography:
      source: "repo"
      path: "geography/production"
      filename: "country_geography.parquet"

    # Bilateral route geography
    pair_geography:
      source: "repo"
      path: "geography/production"
      filename:  "country_pair_geography.parquet"

    # Country geography crosswalk
    geography_crosswalk:
      source: "repo"
      path: "geography/production"
      filename: "country_crosswalk.parquet"
      allow_proxy_mappings: false

    # Pair geography crosswalk
    pair_geography_crosswalk:
      source: "repo"
      path: "geography/production"
      filename: "pair_crosswalk.parquet"
      allow_proxy_mappings: false

    # Annual Oil prices (USD per barrel) for the years 1960–2022, from the World Bank Commodity Price Data
    oil_price:
      source: "repo"
      path: "macroeconomic/prepared"
      filename: "annual_oil_prices.parquet"

    product:
      group_digits: 4
      median_unit_value:
        method: "lagged_product_median"
        minimum_observations: 20
        fallback:
          - "product_group_year"
          - "global_year"

  method:
    flow_keys: []

    training:
      minimum_quantity_concordance: 0.90
      minimum_direct_value_coverage: 0.90

    estimation:
      minimum_evidence_value_usd: 0.0
      minimum_factor: 1.0

      ## upper-limit on cif/fob:  min(domain_cap, max(Q3 + 2.5×IQR, P99))
      maximum_factor_rule: 
        method: robust_adaptive_cap
        iqr_multiplier: 2.5
        percentile: 0.99 
        domain_cap: 3.0
      exclude_proxy_weights: true

      diagnostics:
        upper_tail_audit:
          enabled: true

          threshold: 1.25
          extreme_threshold: 1.50

          persistence:
            minimum_prior_years: 2
            historical_high_share_threshold: 0.50

          value_bands_usd:
            - 10000
            - 100000
            - 1000000
            - 10000000

          quantity_agreement_bands:
            - 0.50
            - 0.75
            - 0.90
            - 0.98

          products:
            summary: "upper_tail_audit_summary"
            route_history: "upper_tail_route_history"
            observations: "upper_tail_observations"


      training_factor_sources:
        - direct


      source_weights:
        direct_reported_weight: 1.0
        direct_estimated_weight: 0.75
        mirror_reported_weight: 0.50
        mirror_estimated_weight: 0.25

      validation:
        strategy: "latest_year"
        holdout_year: null

        temporal_backtest:
          enabled: true
          strategy: "expanding_window"

          # Empty means derive every valid validation year from the available data.
          validation_years: []

          # A validation fold is created only after this many earlier calendar years are available for training.
          minimum_training_years: 4

          # Tail group used in model-evaluation metrics.
          upper_tail_threshold: 1.25

          metrics:
            - median_ape
            - mean_ape
            - p90_ape
            - p95_ape
            - rmse_log_factor
            - r2_log_factor
            - spearman_correlation
            - observed_p95
            - predicted_p95
            - upper_tail_median_ape
            - upper_tail_p90_ape

          output:
            summary_product: "temporal_validation_summary"
            fold_product: "temporal_validation_folds"

      models:
        primary: "hist_gradient_boosting"

        candidates:
          hist_gradient_boosting_squared:
            enabled: true
            type: "machine_learning"
            target_transformation: "log"

            categorical_predictors:
              - hs4_product_group

            loss: "squared_error"
            learning_rate: 0.05
            max_iter: 300
            max_leaf_nodes: 63
            min_samples_leaf: 20
            l2_regularization: 0.0
            max_bins: 255
            random_state: 42

          hist_gradient_boosting:
            enabled: true
            target_transformation: "log"
            type: "machine_learning"
            loss: "absolute_error"
            learning_rate: 0.05
            max_iter: 300
            max_leaf_nodes: 63
            min_samples_leaf: 20
            l2_regularization: 0.0
            max_bins: 255
            random_state: 42
            categorical_predictors:
              - hs4_product_group

          hist_gradient_boosting_squared_level:
            enabled: false
            type: "machine_learning"
            target_transformation: "none"
            categorical_predictors:
              - hs4_product_group

            loss: "squared_error"
            learning_rate: 0.05
            max_iter: 300
            max_leaf_nodes: 63
            min_samples_leaf: 20
            l2_regularization: 0.0
            max_bins: 255
            random_state: 42

          hist_gradient_boosting_squared_regularized:
            enabled: false
            type: "machine_learning"
            target_transformation: "log"
            categorical_predictors:
              - hs4_product_group

            loss: "squared_error"
            learning_rate: 0.05
            max_iter: 300
            max_leaf_nodes: 31
            min_samples_leaf: 50
            l2_regularization: 0.1
            max_bins: 255
            random_state: 42
        
          xgboost_log_squared:
            enabled: false
            type: "machine_learning"
            target_transformation: "log"
            categorical_predictors:
              - hs4_product_group
            objective: "reg:squarederror"
            eval_metric: "mae"

            n_estimators: 2000
            learning_rate: 0.03
            max_depth: 4
            min_child_weight: 20
            subsample: 0.8
            colsample_bytree: 0.8
            reg_alpha: 0.1
            reg_lambda: 5.0

            gamma: 0.0
            random_state: 42
            max_bins: 256
            tree_method: "hist"

            enable_categorical: true
            max_cat_to_onehot: 16

            early_stopping_rounds: 75
            n_jobs: 16


          log_linear_regression:
            enabled: true
            type: "statistical"

            target:
              transformation: "log"

            estimator:
              method: "ols"
              fit_intercept: true

            covariance:
              method: "hc3"

            prediction:
              inverse_transform: "exp"
              
            categorical_predictors:
              - hs4_product_group

          log_linear_regression_smearing:
            enabled: false
            type: "statistical"

            target:
              transformation: "log"

            estimator:
              method: "ols"
              fit_intercept: true

            covariance:
              method: "hc3"

            prediction:
              inverse_transform: "exp_smearing"

            categorical_predictors:
              - hs4_product_group

      primary_predictor_set: "model_5_full_history"

      predictor_sets:
        model_1_classical_gravity:
          numeric:
            - log_distance
            - log_distance_squared
            - contiguity
            - exporter_landlocked
            - importer_landlocked
            - log_product_median_unit_value
            - log_exporter_gdp
            - log_importer_gdp

          categorical:
            - hs4_product_group

        model_2_classical_year_oil:
          numeric:
            - log_distance
            - log_distance_squared
            - contiguity
            - exporter_landlocked
            - importer_landlocked
            - log_product_median_unit_value
            - year
            - log_oil_price_x_log_distance
            - log_exporter_gdp
            - log_importer_gdp

          categorical:
            - hs4_product_group

        model_3_policy_integration:
          numeric:
            - log_distance
            - log_distance_squared
            - contiguity
            - exporter_landlocked
            - importer_landlocked
            - log_product_median_unit_value
            - year
            - log_oil_price_x_log_distance
            - log_lagged_bilateral_trade_value
            - log_exporter_gdp
            - log_importer_gdp
            - gatt_pair
            - wto_pair
            - eu_pair
            - fta_wto
          categorical:
            - hs4_product_group

        model_4_trade_scale_history:
          numeric:
            - log_distance
            - log_distance_squared
            - contiguity
            - exporter_landlocked
            - importer_landlocked
            - log_product_median_unit_value
            - year
            - log_oil_price_x_log_distance
            - log_lagged_bilateral_trade_value
            - log_lagged_pair_product_trade_value
            - log_exporter_gdp
            - log_importer_gdp

          categorical:
            - hs4_product_group

        model_5_full_history:
          numeric:
            - log_distance
            - log_distance_squared
            - contiguity
            - exporter_landlocked
            - importer_landlocked
            - log_product_median_unit_value
            - year
            - log_oil_price_x_log_distance
            - log_lagged_bilateral_trade_value
            - log_lagged_pair_product_trade_value
            - lagged_pair_median_factor
            - years_since_latest_pair_factor
            - lagged_pair_product_median_factor
            - log_exporter_gdp
            - log_importer_gdp
            - gatt_pair
            - wto_pair
            - eu_pair
            - fta_wto

          categorical:
            - hs4_product_group   

        model_6_policy_plus_factor_history:
          numeric:
            - log_distance
            - log_distance_squared
            - contiguity
            - exporter_landlocked
            - importer_landlocked
            - log_product_median_unit_value
            - year
            - log_oil_price_x_log_distance
            - log_exporter_gdp
            - log_importer_gdp
            - gatt_pair
            - wto_pair
            - eu_pair
            - fta_wto
            - lagged_pair_median_factor
            - years_since_latest_pair_factor
            - lagged_pair_product_median_factor

          categorical:
            - hs4_product_group      


    predictors:
      bilateral:
        - log_distance
        - log_distance_squared
        - contiguity
        - exporter_landlocked
        - importer_landlocked
        - lagged_pair_median_factor
        - years_since_latest_pair_factor
        - log_exporter_gdp
        - log_importer_gdp

      
      fuel_and_time:
        - log_oil_price_x_log_distance
        - year

      product:
        - log_product_median_unit_value
        - hs4_product_group

      route:
        - log_lagged_bilateral_trade_value
        - log_lagged_pair_product_trade_value
        - lagged_pair_product_median_factor

      optional_connectivity: []
      #  - exporter_liner_shipping_connectivity
      #  - importer_liner_shipping_connectivity
      #  - exporter_logistics_performance
      #  - importer_logistics_performance

    outliers:
      method: "robust_residual"