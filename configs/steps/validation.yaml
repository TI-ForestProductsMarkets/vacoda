# configs/steps/validation.yaml
# Final VACODA validation, quality-control configuration.

validation:

  # --------------------------------------------------------------------
  # Input
  # --------------------------------------------------------------------
  input:
    stage: "interim"
    subdir: "value/target_{target_hs_lower}"
    filename: "comtrade_target_{target_hs_lower}_value_deflated.parquet"
    format: "parquet"

  # --------------------------------------------------------------------
  # Output
  # --------------------------------------------------------------------
  output:
    stage: "processed"
    subdir: "validation/target_{target_hs_lower}"
    format: "parquet"

  # --------------------------------------------------------------------
  # Products
  # --------------------------------------------------------------------
  products:

    prepared_input:
      enable: true
      filename: "prepared/comtrade_target_{target_hs_lower}_prepared.parquet"

    structural_audit:
      enable: true
      filename: "audits/target_{target_hs_lower}_structural_audit.parquet"

    # quantity_selection:
    #   enable: true
    #   filename: "quantity/comtrade_target_{target_hs_lower}_quantity_selection.parquet"

    # quantity_selection_audit:
    #   enable: true
    #   filename: "audits/target_{target_hs_lower}_quantity_selection_audit.parquet"
      
    training_sample:
      enable: true
      filename: "training/comtrade_target_{target_hs_lower}_training_sample.parquet"
    
    model_predictions:
      enable: true
      filename: "model/target_{target_hs_lower}_model_predictions.parquet"
    
    selected_model:
      enable: true
      filename: "model/target_{target_hs_lower}_selected_model.parquet"

    fitted_model:
      enable: true
      filename: "model/target_{target_hs_lower}_fitted_model.parquet"
    
    inference:
      enable: true
      filename: "model/target_{target_hs_lower}_inference.parquet"

    inference_audit:
      enable: true
      filename: "audits/target_{target_hs_lower}_inference_audit.parquet"

    diagnostics:
      enable: true
      filename: "diagnostics/target_{target_hs_lower}_diagnostics.parquet"
      
  # --------------------------------------------------------------
  # Model development
  # --------------------------------------------------------------

  model:

    checkpoints:
      enable: true
      subdir: "model/checkpoints"
      
    # ------------------------------------------------------------
    # Training population
    # ------------------------------------------------------------
    training_sample:
      reference_year_window:
        before: 2
        after: 0
      min_hs_year_reference_observations: 30
      max_normalized_uv_distance_mad: 2.5

    # ------------------------------------------------------------
    # Prediction target
    # ------------------------------------------------------------
    target:
      column: "trade_synced_quantity_kg"
      transform: "log"

    # ------------------------------------------------------------
    # Features
    # ------------------------------------------------------------
    features:
      numeric:
        trade_value_reconciled_constant_usd:
          transform: "log"
        year:
          transform: "none"

      categorical:
        - exporter_iso
        - importer_iso
        - target_cmd
        - target_hs4

      exclude:
        - quantity_selected_kg
        - quantity_simple_mean_kg
        - trade_synced_quantity_kg
        - quantity_reliability_weighted_kg
        - export_synchronized_quantity_kg
        - import_synchronized_quantity_kg
        - selected_unit_value
        - selected_uv_log_distance
        - training_normalized_uv_distance

    # ------------------------------------------------------------
    # Validation
    # ------------------------------------------------------------
    validation:
      strategy: "expanding_window"
      year_column: "year"
      minimum_training_years: 5

    # ------------------------------------------------------------
    # Candidate models
    # ------------------------------------------------------------
    models:
      ridge:
        enable: true
        type: "ridge"
        parameters:
          alpha: 1.0

      histogram_gradient_boosting:
        enable: true
        type: "hist_gradient_boosting"
        parameters:
          learning_rate: 0.05
          max_iter: 300
          max_leaf_nodes: 31
          min_samples_leaf: 50

      extra_trees:
        enable: true
        type: "extra_trees"
        parameters:
          n_estimators: 300
          min_samples_leaf: 5
          max_features: 0.8
      
      random_forest:
        enable: true
        type: "random_forest"
        parameters:
          n_estimators: 300
          min_samples_leaf: 5
          max_features: 0.8

      mlp:
        enable: true
        type: "mlp"
        parameters:
          activation: "relu"
          solver: "adam"
          alpha: 0.0001
          batch_size: 1024
          learning_rate_init: 0.001
          max_iter: 200
          early_stopping: true
          validation_fraction: 0.1
          n_iter_no_change: 15
          tol: 0.0001
          
      emb_mlp_bs4096_lr0p001:
        enable: true
        type: "embedding_mlp"
        parameters:
          batch_size: 4096
          learning_rate: 0.001
          max_epochs: 35
          patience: 5
          early_stopping: true

          min_delta: 0.001
          internal_validation_fraction: 0.10

          exporter_embedding_dim: 16
          importer_embedding_dim: 16
          product_embedding_dim: 32
          hs4_embedding_dim: 16

          hidden_layer_1: 128
          hidden_layer_2: 64

      emb_mlp_bs8192_lr0p001:
        enable: false
        type: "embedding_mlp"
        parameters:
          batch_size: 8192
          learning_rate: 0.001
          max_epochs: 35
          patience: 5
          early_stopping: true

          min_delta: 0.001
          internal_validation_fraction: 0.10

          exporter_embedding_dim: 16
          importer_embedding_dim: 16
          product_embedding_dim: 32

          hidden_layer_1: 128
          hidden_layer_2: 64

      emb_mlp_bs16384_lr0p001:
        enable: false
        type: "embedding_mlp"
        parameters:
          batch_size: 16384
          learning_rate: 0.001
          max_epochs: 35
          patience: 5
          early_stopping: true

          min_delta: 0.001
          internal_validation_fraction: 0.10

          exporter_embedding_dim: 16
          importer_embedding_dim: 16
          product_embedding_dim: 32

          hidden_layer_1: 128
          hidden_layer_2: 64

    # ------------------------------------------------------------
    # Evaluation
    # ------------------------------------------------------------
    evaluation:
      metrics:
        - mae_log
        - rmse_log
        - median_absolute_log_error

    selection:
      enabled: false
      primary_metric: "mae_log"


    random_seed: 42

  # --------------------------------------------------------------------
  # Method
  # --------------------------------------------------------------------
  method:
    structural:
      required_fields:
        - year
        - exporter_iso
        - importer_iso
        - target_cmd

        - trade_value_reconciled
        - trade_value_reconciled_constant_usd

        - trade_synced_quantity_kg
        - trade_synced_quantity_method
        - trade_synced_quantity_status

        - export_synchronized_quantity_kg
        - import_synchronized_quantity_kg
        - export_is_synchronized_quantity_estimated
        - import_is_synchronized_quantity_estimated

        - quantity_availability_case
        - quantity_relative_difference

        - product_year_median_unit_value
        - product_year_log_unit_value_mad
        - unit_value_reference_observations

        - export_unit_value_log_distance
        - import_unit_value_log_distance
        - mean_unit_value_log_distance

      canonical_key:
        - year
        - exporter_iso
        - importer_iso
        - target_cmd
      
      duplicate_keys:
        fail_on_duplicates: true

      require_positive_value: true
      require_positive_quantity: true


  # --------------------------------------------------------------
  # Diagnostics 
  # --------------------------------------------------------------
  diagnostics:

    columns:
      year: "year"
      product: "target_cmd"

      quantity: "trade_synced_quantity_kg"
      nominal_value: "trade_value_reconciled"
      constant_value: "trade_value_reconciled_constant_usd"

      export_quantity: "export_synchronized_quantity_kg"
      import_quantity: "import_synchronized_quantity_kg"

      export_estimated: "export_is_synchronized_quantity_estimated"
      import_estimated: "import_is_synchronized_quantity_estimated"

      quantity_relative_difference: "quantity_relative_difference"

      unit_value_reference: "product_year_median_unit_value"
      unit_value_reference_observations: "unit_value_reference_observations"

    # --------------------------------------------------------------
    # Candidate pseudo-truth population
    # --------------------------------------------------------------

    training_population_sensitivity:

      require_bilateral_quantities: true
      require_non_estimated_quantities: true

      disagreement_thresholds:
        - 0.05
        - 0.10
        - 0.20
        - 0.30
        - 0.50
        - 0.90

      unit_value_reference_min_observations:
        - 30
        - 100
        - 500

      unit_value_log_distance_thresholds:
        - 0.25
        - 0.50
        - 1.00

    # --------------------------------------------------------------
    # Diagnostic target
    # --------------------------------------------------------------

    target:
      transform: "log"

    selection:
      enabled: false

  # # --------------------------------------------------------------------
  # # Release
  # # --------------------------------------------------------------------
  # release:

  #   columns:
  #     year: "year"
  #     reporter: "exporter_iso"
  #     partner: "importer_iso"
  #     flow: "flow_code"
  #     hs_code: "target_cmd"
  #     quantity_kg: "quantity_kg"
  #     trade_value_usd: "trade_value_reconciled"
  #     trade_value_constant_usd: "trade_value_reconciled_constant_usd"

  #   sort_by:
  #     - year
  #     - reporter
  #     - partner
  #     - flow
  #     - hs_code

  # --------------------------------------------------------------------
  # Decision
  # --------------------------------------------------------------------

  decision:

    fail_on:
      structural_failure: true
      duplicate_keys: true
      invalid_hs_codes: true
      invalid_years: true

    allow_flagged_outliers: true
    allow_imputed_rows: true

    ready_flag: "ready_for_release"


  # --------------------------------------------------------------------
  # Logging
  # --------------------------------------------------------------------

  logging:
    level: "DEBUG"
    subdir: "logs/validation"
    file: "LOG_VALIDATION_TARGET_{target_hs_lower}.log"
    timestamp: true

  # --------------------------------------------------------------------
  # Decision report
  # --------------------------------------------------------------------

  artifacts:
    enable: true
    kind: "reports"
    subdir: "validation/target_{target_hs_lower}"
    filename: "target_{target_hs_lower}_validation_decision_report"
    timestamp: true
    write_latest: true